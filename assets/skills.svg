<svg xmlns="http://www.w3.org/2000/svg" width="820" height="289" viewBox="0 0 820 289">
  <defs>
    <style><![CDATA[
      :root {
        --bg: #0d1117;
        --titlebar-bg: #161b22;
        --border: #21262d;
        --fg: #d4d4d4;
        --dim: #6e7681;
        --muted: #7a8290;
        --warn: #e5c07b;
        --accent: #2aaea6;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #dde5ef;
          --titlebar-bg: #c8d3e0;
          --border: #a5b3c2;
          --fg: #1a1f26;
          --dim: #5c6773;
          --muted: #5c6773;
          --warn: #b8860b;
        }
      }
      .term  { font-family: 'JetBrains Mono NF','JetBrainsMonoNL Nerd Font','JetBrains Mono','Fira Code','Cascadia Code','SF Mono','Menlo','Consolas',monospace; }
      .accent{ fill: var(--accent); }
      .fg    { fill: var(--fg); }
      .dim   { fill: var(--dim); }
      .warn  { fill: var(--warn); }
      .muted { fill: var(--muted); }
      .bg-main       { fill: var(--bg); }
      .bg-titlebar   { fill: var(--titlebar-bg); }
      .stroke-border { stroke: var(--border); fill: none; }
      .widget-border { fill: none; stroke: var(--titlebar-bg); stroke-width: 2; }
      .bold  { font-weight: 700; }
    ]]></style>
  </defs>

  <!-- Terminal window -->
  <rect class="bg-main" x="0" y="0" width="820" height="289" rx="10" ry="10"/>

  <!-- Title bar -->
  <path class="bg-titlebar" d="M 0,10 Q 0,0 10,0 L 810,0 Q 820,0 820,10 L 820,34 L 0,34 Z"/>
  <line class="stroke-border" x1="0" y1="34" x2="820" y2="34" stroke-width="1"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="6" fill="#febc2e"/>
  <circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="410" y="22" text-anchor="middle" font-size="12" class="term muted">Terminal - skills</text>

  <!-- Prompt line: baseline y=60 (16px gap from title bar bottom) -->
  <text x="24" y="60" font-size="13" class="term">
    <tspan class="fg">[</tspan><tspan class="accent bold">whoam1-dev@github</tspan><tspan class="fg"> </tspan><tspan class="accent">~</tspan><tspan class="fg">]$ tree skills/</tspan>
  </text>

  <!-- Tree (rounded corners, tight row spacing so │ chars connect) -->
  <g class="term" font-size="14" xml:space="preserve">
    <text x="40"  y="90"  class="fg">skills/</text>

    <text x="40"  y="108" class="dim">├─ <tspan class="accent bold">languages/</tspan></text>
    <text x="40"  y="126" class="dim">│  ├─ <tspan class="fg">Java</tspan></text>
    <text x="40"  y="144" class="dim">│  ├─ <tspan class="fg">Python</tspan></text>
    <text x="40"  y="162" class="dim">│  ├─ <tspan class="fg">SQL</tspan></text>
    <text x="40"  y="180" class="dim">│  ╰─ <tspan class="fg">Assembly</tspan>    <tspan class="dim">↳</tspan> <tspan class="warn">[ learning ]</tspan></text>

    <text x="40"  y="198" class="dim">├─ <tspan class="accent bold">tools/</tspan></text>
    <text x="40"  y="216" class="dim">│  ├─ <tspan class="fg">Git</tspan></text>
    <text x="40"  y="234" class="dim">│  ╰─ <tspan class="fg">JetBrains</tspan></text>

    <text x="40"  y="252" class="dim">╰─ <tspan class="accent bold">system/</tspan></text>
    <text x="40"  y="270" class="dim">   ╰─ <tspan class="fg">Linux</tspan></text>
  </g>

  <rect class="widget-border" x="1" y="1" width="818" height="287" rx="10" ry="10"/>
</svg>
