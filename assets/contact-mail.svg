<svg xmlns="http://www.w3.org/2000/svg" width="820" height="91" viewBox="0 0 820 91">
  <defs>
    <style><![CDATA[
      :root {
        --bg: #0d1117;
        --titlebar-bg: #161b22;
        --border: #21262d;
        --fg: #d4d4d4;
        --muted: #7a8290;
        --accent: #2aaea6;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #dde5ef;
          --titlebar-bg: #c8d3e0;
          --border: #a5b3c2;
          --fg: #1a1f26;
          --muted: #5c6773;
        }
      }
      .term  { font-family: 'JetBrains Mono NF','JetBrainsMonoNL Nerd Font','JetBrains Mono','Fira Code','Cascadia Code','SF Mono','Menlo','Consolas',monospace; }
      .accent{ fill: var(--accent); }
      .fg    { fill: var(--fg); }
      .muted { fill: var(--muted); }
      .bg-main       { fill: var(--bg); }
      .bg-titlebar   { fill: var(--titlebar-bg); }
      .stroke-border { stroke: var(--border); fill: none; }
      .envelope-fold { fill: none; stroke: var(--bg); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .widget-border { fill: none; stroke: var(--titlebar-bg); stroke-width: 2; }
      .bold  { font-weight: 700; }
    ]]></style>
  </defs>

  <!-- Rounded top only, flat bottom -->
  <path class="bg-main" d="M 10,0 L 810,0 Q 820,0 820,10 L 820,91 L 0,91 L 0,10 Q 0,0 10,0 Z"/>

  <!-- Title bar -->
  <path class="bg-titlebar" d="M 10,0 L 810,0 Q 820,0 820,10 L 820,34 L 0,34 L 0,10 Q 0,0 10,0 Z"/>
  <line class="stroke-border" x1="0" y1="34" x2="820" y2="34" stroke-width="1"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="6" fill="#febc2e"/>
  <circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="410" y="22" text-anchor="middle" font-size="12" class="term muted">Terminal - contact</text>

  <!-- Prompt: baseline y=60 (16px gap from title bar bottom to glyph top) -->
  <text x="24" y="60" font-size="13" class="term">
    <tspan class="fg">[</tspan><tspan class="accent bold">whoam1-dev@github</tspan><tspan class="fg"> </tspan><tspan class="accent">~</tspan><tspan class="fg">]$ cat contact.txt</tspan>
  </text>

  <!-- Email row: 22px row spacing from prompt. Icon indented as command output. -->
  <g transform="translate(44, 69) scale(0.6667)">
    <path class="accent" d="M2 4h20a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
    <path class="envelope-fold" d="M0.5 6.5 12 14 23.5 6.5"/>
  </g>
  <text x="70" y="82" font-size="14" class="term accent bold">email</text>

  <!-- Border: rounded top, no bottom edge (flows into discord SVG) -->
  <path class="widget-border" d="M 1,91 L 1,11 A 10,10 0 0 1 11,1 L 809,1 A 10,10 0 0 1 819,11 L 819,91"/>
</svg>
